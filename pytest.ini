[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    phase1: OCR implementation tests
    phase2: Invoice processor tests (LLM integration)
    integration: Integration tests with real data
    e2e: End-to-end tests with complete pipeline (no mocking)
